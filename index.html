<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calc-view">

        <div class="wrapper">
            
            <div class="display-screen">
                <div class="text">999</div>
            </div>

            <div class="buttons">
                <button class="clear-btn">Clear</button>
                <button class="delete-btn">Del</button>
                <button class="percentage-btn">%</button>
                <button class="division-btn">/</button>
                <button class="number7-btn">7</button>
                <button class="number8-btn">8</button>
                <button class="number9-btn">9</button>
                <button class="multiply-btn">x</button>
                <button class="number4-btn">4</button>
                <button class="number5-btn">5</button>
                <button class="number6-btn">6</button>
                <button class="subtract-btn">-</button>
                <button class="number1-btn">1</button>
                <button class="number2-btn">2</button>
                <button class="number3-btn">3</button>
                <button class="add-btn">+</button>
                <button class="don'tKnowYet-btn">?</button>
                <button class="number0-btn">0</button>
                <button class="floatpoint-btn">.</button>
                <button class="equal-btn">=</button>
            </div>
        </div>
    </div>
</body>
</html>
